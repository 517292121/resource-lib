<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<HTML>
<HEAD>
<TITLE>插入图片文件</TITLE>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

<script language="JavaScript">
function IsDigit()
{
  return ((event.keyCode >= 48) && (event.keyCode <= 57));
}
function OK(){
  var str1="";
  var strurl=document.form1.url.value;
  if (strurl==""||strurl=="http://")
  {
  	alert("请先输入文件地址！");
	return false;
  }
  else
  {
    str1="<a href='"+document.form1.url.value+"' target=_blank style='text-decoration: none;color:red;'>"+document.form1.wjm.value+"</a>";
    window.returnValue = str1+"$$$"+"<font color='red'>"+document.form1.wjm.value+"</font>";
    //alert(document.form1.wjm.value);
    window.close();
  }
}
</script>
</head>
<BODY bgColor=menu topmargin=15 leftmargin=15 >

  <tr><td>
<FIELDSET align=left>
<LEGEND align=left>输入图片参数</LEGEND>
<table border="0" align=center cellpadding="0" cellspacing="3">
    <tr>
        <td colspan="2">
            文件名称：<input name="wjm" id="wjm" value='在线下载' size=38 maxlength="200"></td>
    </tr>
<tr>
  <td colspan="2" style="height: 22px">地址：
    <input name="url" id="url" value='http://' size=38 maxlength="200" />
</td>
  </tr></table>
</fieldset>
</td><td width=80 align="center"><input name="cmdOK" type="button" id="cmdOK" value="  确定  " onClick="OK();"/>
  <br/>
  <br/>
<input name="cmdCancel" type=button id="cmdCancel" onclick="window.close();" value='  取消  '></td></tr>
  <tr>
    <td>

<iframe class="TBGen" style="top:2px" ID="UploadFiles" src="uploadfile.jsp" frameborder=0 scrolling=no width="350" height="25"></iframe>
</fieldset>
	</td>
    <td align="center"><input name="UpFileName" type="hidden" id="UpFileName" value="None"></td>
  </tr>
